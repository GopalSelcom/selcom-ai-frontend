name: passport_mrz_capture
description: Camera capture with passport placeholder and MRZ band OCR for TD3 passports.
version: 1.0.0
publish_to: "none"

environment:
  sdk: ">=3.4.3 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.6
  google_mlkit_face_detection: ^0.13.2
  google_mlkit_text_recognition: ^0.15.1
  image: ^4.3.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
