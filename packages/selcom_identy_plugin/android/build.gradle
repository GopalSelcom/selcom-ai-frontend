group = "com.example.selcom_identy_plugin"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.13.2")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://identy.jfrog.io/identy/identy-finger-release"
            credentials {
                username = "selcom"
                password = "bB46AVqhSU9iyDl0VJiob"
            }
        }
    }
}

apply plugin: "com.android.library"

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "com.example.selcom_identy_plugin"
    }

    compileSdk = 36
    ndkVersion = "29.0.14206865"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdk = 26

        ndk {
            // Only 64-bit ARM if that’s all you need
            abiFilters "arm64-v8a"
        }
    }

    dependencies {
        testImplementation("junit:junit:4.13.2")
//        testImplementation("org.mockito:mockito-core:5.0.0")
        implementation(group: 'com.identy.app', name: 'finger', version: '7.3.0', ext: 'aar')
        implementation 'com.android.volley:volley:1.2.1'
        implementation 'androidx.appcompat:appcompat:1.3.0'
    }

    afterEvaluate {
        android.defaultConfig.resValue "string", "sdk_version", "\"${getSDKVersion()}\""
    }

    ext.getSDKVersion = {
        ->
        def dependencies = configurations.implementation.getDependencies()
        def libDef = dependencies.matching {
            it.group == "com.identy.app" && (it.name == "finger" || it.name == "finger-staging")
        }
        if (libDef.size() > 0) {
            return libDef[0].version
        } else {
            return "unknown"
        }
    }



    testOptions {
        unitTests.all {
            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
